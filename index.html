<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f8f7f3">
  <title>Campe — 発表のカンペ</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div class="timer">
      <div><output id="stopwatchDisplay" aria-label="経過時間">00:00</output></div>
      <div class="timer-actions"><button id="startBtn" class="primary">開始</button><button id="resetBtn" class="subtle">リセット</button><button id="menuBtn" class="subtle" aria-label="メニューを開く" aria-haspopup="dialog">⋯</button></div>
    </div>
    <div class="reading-target" aria-label="読み終える目安"><strong id="readingDeadline"></strong></div>
    <p id="status" role="status" hidden></p>
  </header>
  <main id="memoContainer" tabindex="0" aria-label="発表原稿">
    <div id="memoContent"></div>
    <div id="emptyState"><p>原稿を入れて始めましょう。</p><button id="emptyEditBtn" class="primary">原稿を書く</button><button id="emptyImportBtn" class="subtle">インポート</button></div>
  </main>
  <dialog id="menuDialog" aria-labelledby="menuTitle">
    <div class="dialog-heading"><h2 id="menuTitle">メニュー</h2><button id="closeMenuBtn">閉じる</button></div>
    <p class="help"><b id="currentPage">1</b> / <span id="totalPages">1</span>ページ · <span id="readingDuration"></span></p>
    <div class="display-modes" role="group" aria-label="原稿の表示方法"><button id="readableMode" aria-pressed="true">読みやすいサイズ</button><button id="fitMode" aria-pressed="false">全文を収める</button></div>

    <div class="tools"><button id="editBtn">編集</button><button id="importBtn">インポート</button><span class="spacer"></span><button id="smallerBtn" aria-label="文字を小さく">A−</button><button id="largerBtn" aria-label="文字を大きく">A＋</button></div>
    <nav aria-label="ページ送り"><button id="prevBtn">← 前へ</button><span id="pageLabel">1 / 1</span><button id="nextBtn" class="primary">次へ →</button></nav>
  </dialog>
  <dialog id="editDialog">
    <form method="dialog" id="editForm">
      <div class="dialog-heading"><h2 id="editTitle">原稿を編集</h2><button value="close" aria-label="編集を閉じる">閉じる</button></div>
      <p class="help">入力した内容は自動保存されます。</p>
      <div class="duration-setting"><label for="durationInput">このページを読む時間（秒）</label><input id="durationInput" type="number" inputmode="numeric" min="1" max="86400" step="1" placeholder="自動" aria-describedby="durationHelp"></div>
      <p class="help" id="durationHelp">空欄なら1分300文字で目安を計算。前のページからの合計が読み切る時刻になります。</p>
      <textarea id="editTextarea" aria-label="このページの原稿" placeholder="このページで話すことを書いてください。"></textarea>
      <div class="dialog-actions"><button type="button" id="deleteSlideBtn" class="danger">このページを削除</button><button type="button" id="addSlideBtn">ページを追加</button><button value="close" class="primary">完了</button></div>
    </form>
  </dialog>
  <dialog id="importDialog">
    <form method="dialog" id="importForm">
      <div class="dialog-heading"><h2>原稿をインポート</h2><button value="cancel" aria-label="インポートを閉じる">閉じる</button></div>
      <p class="help">変換したCampe原稿を、そのまま全部貼り付けてください。ページと秒数をまとめて取り込みます。<br>通常の文章は空行でページを分割します。現在の原稿を置き換えます。</p>
      <textarea id="importTextarea" aria-label="まとめて取り込む原稿" placeholder="1ページ目の原稿\n\n2ページ目の原稿"></textarea>
      <p id="importError" class="help" role="alert" hidden></p>
      <div class="dialog-actions"><button value="cancel">キャンセル</button><button type="button" id="importConfirmBtn" class="primary">取り込む</button></div>
    </form>
  </dialog>
  <script src="app.js"></script>
</body>
</html>
