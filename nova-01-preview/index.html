<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#05050a">
  <title>NOVA/01</title>
  <style>
    html,body{margin:0;min-height:100%;background:#05050a;color:#fff;font-family:system-ui,-apple-system,sans-serif}
    body{display:grid;place-items:center;min-height:100dvh}
    .boot{font:700 11px/1.4 ui-monospace,SFMono-Regular,monospace;letter-spacing:.18em;opacity:.7}
  </style>
</head>
<body>
  <div class="boot">INITIALIZING NOVA/01…</div>
  <script>
    (async()=>{
      const sources=[
        'https://raw.githubusercontent.com/yuu0428/Campe/nova-01-preview-20260817/nova-01-preview/index.html',
        'https://raw.githack.com/yuu0428/Campe/nova-01-preview-20260817/nova-01-preview/index.html'
      ];
      let lastError;
      for(const url of sources){
        try{
          const res=await fetch(url,{cache:'no-store'});
          if(!res.ok) throw new Error('HTTP '+res.status);
          const html=await res.text();
          if(!html.toLowerCase().includes('<!doctype html')) throw new Error('Invalid HTML');
          document.open();
          document.write(html);
          document.close();
          return;
        }catch(err){lastError=err;}
      }
      document.body.innerHTML='<div style="padding:24px;max-width:560px"><b>NOVA/01 failed to load.</b><br><br><span style="opacity:.65">'+String(lastError||'Unknown error')+'</span></div>';
    })();
  </script>
</body>
</html>
